name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build -p:ControlBatyrCheckDocuments=true
      - run: dotnet test --no-build
      - name: Pack and verify local packages
        shell: pwsh
        run: ./tests/PackageSmoke/smoke.ps1
